<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Calculadora-jest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calculadora">
      <h2>Calculadora</h2>

      <input type="number" id="num1" placeholder="Número 1" />
      <input type="number" id="num2" placeholder="Número 2" />

      <div class="botones">
        <button onclick="operar('sumar')">+</button>
        <button onclick="operar('restar')">-</button>
        <button onclick="operar('multiplicar')">*</button>
        <button onclick="operar('dividir')">/</button>
      </div>

      <p id="resultado"></p>

      <h3>Historial</h3>
      <ul id="historial"></ul>

      <button onclick="limpiarHistorial()">Limpiar Historial</button>
    </div>

    <script src="../src/calculadora.js"></script>
    <script src="../src/app.js"></script>
  </body>
</html>
